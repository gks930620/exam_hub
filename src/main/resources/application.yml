dotenv:
  enabled: true  # .env 파일 자동 로드 (QNET_API_KEY 등 로컬 시크릿 주입용)

# 환경 무관 실행(코드컨벤션 §5): 기본=local, 운영은 SPRING_PROFILES_ACTIVE=prod 로만 가른다.
# Railway 는 주입된 PORT 로 리슨해야 하고, 프록시 뒤 절대 URL 을 위해 forward-headers 를 신뢰한다.
server:
  # 로컬 기본 포트는 8081 로 고정한다(8080 은 다른 프로젝트가 자주 쓴다 — 사용자 지시 2026-08-06).
  # 운영(Railway)은 주입된 PORT 를 그대로 따른다.
  port: ${PORT:8081}
  forward-headers-strategy: framework

spring:
  # 소셜 로그인 키는 저장소에 두지 않는다. 프로젝트 루트 oauth.yml 을 만들면 로그인이 켜지고,
  # 없으면 로그인만 꺼진 채 나머지가 정상 동작한다(oauth.yml.example 참고).
  config:
    import: "optional:file:./oauth.yml"

  # ── 소셜 로그인 provider (비밀값 아님 → 여기 둔다) ──
  # 카카오는 스프링 내장 provider 가 없어서 이 URI 들을 누군가는 반드시 알려줘야 한다.
  # 이걸 oauth.yml 에만 두면 그 파일이 .gitignore 라 **배포 이미지에는 없고**, 운영에서
  # 키(client-id/secret)를 환경변수로 넣어도 provider 를 몰라 로그인이 안 뜬다.
  # → 환경마다 설정을 고치지 않으려면(코드컨벤션 §5) 비밀 아닌 값은 여기, 비밀은 환경변수·oauth.yml.
  # 구글은 스프링이 내장 provider 를 갖고 있어 아무것도 안 적어도 된다.
  #
  # registration(client-id/secret)은 여기 두지 않는다 — 빈 값이라도 적으면
  # "Client id must not be empty" 로 기동이 깨져서, 키 없이 뜨는 성질을 잃는다.
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # 아무 프로파일도 지정하지 않으면 local(로컬 개발)로 뜬다. 운영은 prod 를 명시.
  profiles:
    default: local

  # 페이징 상한(DoS 방어): ?size=1000000 같은 과대 요청을 막는다.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # 로컬은 인메모리 H2(MySQL 호환) 사용 → 로컬에 MySQL 없어도 실행됨. 배포는 prod 프로파일에서 MySQL.
  # 모든 값은 환경변수 주입 가능(기본값은 로컬 개발용). 운영에서 이 기본값(H2)으로 뜨면 RailwayDeploymentValidator 가 fail-fast.
  datasource:
    # 로컬은 파일 H2 다(인메모리 아님). 시험일정 2,400여 건을 매 기동 다시 넣으면 1~2분씩 걸려서,
    # 한 번 넣은 걸 그대로 쓴다. 비우려면 .localdb 폴더를 지우고 다시 켜면 된다.
    # AUTO_SERVER=TRUE 는 필수다 — devtools 가 앱을 다시 띄울 때 옛 커넥션이 파일 잠금을 아직
    # 쥐고 있어서, 없으면 "Database may be already in use" 로 기동이 깨진다(실제로 겪었다).
    # 덤으로 서버가 떠 있는 채로 인텔리제이 DB 도구나 h2-console 로 붙어볼 수 있다.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./.localdb/exam;MODE=MySQL;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true   # http://localhost:8081/h2-console (JDBC URL: jdbc:h2:file:./.localdb/exam) — 운영은 prod 프로파일에서 off

  jpa:
    hibernate:
      # 로컬도 update 다 — 파일 DB 라 스키마를 날리면 넣어 둔 일정까지 같이 사라진다.
      # 엔티티를 크게 바꿔 update 로 못 따라가면 .localdb 를 지우고 다시 켠다(= 예전 create 와 같은 상태).
      # 데모 데이터는 SQL 시드가 아니라 ExamDataInitializer(@Profile("!prod"), 자바)가 적재한다.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        # ⚠️ enum 은 엔티티에서 @JdbcTypeCode(SqlTypes.VARCHAR) 로 저장한다(설정으로는 안 먹었다).
        # 네이티브 ENUM 은 값 목록이 스키마에 박히는데 우리는 ddl-auto=update 라 그 목록이 저절로 안 넓어진다.
        # 그래서 enum 에 값을 하나만 더해도 기존 DB 에서 기동이 통째로 깨진다 —
        # 2026-09-08 CertificateLifecycle.EXCLUDED 를 더하다 실제로 겪었다.
        # EnumColumnTypeTest 가 재발을 막는다.
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
    # data.sql 을 Hibernate 가 스키마를 만든 뒤에 실행한다.
    # 이게 없으면 테이블이 없는 상태에서 INSERT 가 돌아 기동이 깨진다.
    defer-datasource-initialization: true

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace


# Actuator 설정 (서버 상태 모니터링)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics  # 노출할 엔드포인트
  endpoint:
    health:
      show-details: when_authorized  # 인증된 사용자만 상세 정보

# Swagger 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html  # Swagger UI 경로
    tags-sorter: alpha      # 태그 알파벳 순 정렬
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ===== exam-hub 수집/알림 설정 =====
# 개발: 큐넷 실 API 키 없음 → Mock 소스로 수집 파이프라인 동작(MockScheduleSource).
qnet:
  api:
    # .env 의 QNET_API_ENABLED 로 켠다. 켜 두어도 기동 때는 수집하지 않는다(collect.on-startup 기본 false) —
    # 613콜이 나가서 재시작 두 번이면 일 한도(1,000)를 넘긴다. 실 수집은 05:00 스케줄러가 한다.
    enabled: ${QNET_API_ENABLED:false}
    key: ${QNET_API_KEY:}          # 공공데이터포털 서비스키(Encoding 키) — 발급 후 주입
    base-url: https://apis.data.go.kr/B490007/qualExamSchd

# 기동 시 네트워크 수집(큐넷 613콜 + 스크래퍼 8곳)을 돌릴지. 기본 false — 파일 시드(스냅샷·비큐넷·데모)만 읽는다.
# 예전엔 "큐넷이 꺼져 있으면 돌린다"였는데, .env 없는 새 환경에서 첫 기동에 시행처 8곳을 실호출했다.
# 지금 당장 받아야 하면: ./gradlew bootRun --args="--collect.on-startup=true"
collect:
  on-startup: ${COLLECT_ON_STARTUP:false}

# 발송: NotificationSenderChain 이 알림톡 → 카카오 메모 → 이메일 → 로그 순으로 시도한다.
# 실발송 채널이 안 켜진 로컬은 결과적으로 LogNotificationSender(로그)만 돈다. 운영은 MAIL_ENABLED=true 로 이메일 실발송.

# 시행처 HTML 스크래핑(상의·KCA·Kdata·TOEIC·TEPS·JLPT·TOPIK·국시원). 기본 on — 운영에서도 05:00 전량 배치에서 API 와 같이 돈다.
# 기동 때는 안 돈다(collect.on-startup 이 false 면 파일 시드만 읽는다). 사이트가 깨져 소음이 나면 false 로 끈다.
# 사이트별 실측·수리법: 설계/시험데이터/03_스크래퍼_정비.md
scrape:
  enabled: ${SCRAPE_ENABLED:true}

# ===== 알림 발송 =====
# 채널 우선순위: 알림톡 → 이메일 → 로그 (NotificationSenderChain).
# 한국에서 알림은 결국 카톡이라 알림톡이 1순위. 번호가 없거나 카톡을 안 쓰면 이메일로 폴백한다.
# ⚠️ notification 키는 여기 한 곳에만 둔다 — YAML 은 같은 키가 두 번 나오면 뒤엣것이 앞엣것을 통째로 덮는다.
notification:

  # ── 카카오 알림톡 (대행사: SOLAPI) ──
  # 사업자등록 → 채널 개설 → 발신프로필 → 템플릿 사전심사가 끝나야 켤 수 있다.
  # 절차와 심사 제출용 문구: 운영/01_카카오_설정.md
  alimtalk:
    enabled: ${ALIMTALK_ENABLED:false}
    api-key: ${ALIMTALK_API_KEY:}
    api-secret: ${ALIMTALK_API_SECRET:}
    pf-id: ${ALIMTALK_PF_ID:}            # 발신프로필 키(어느 카카오톡 채널로 보낼지)
    from: ${ALIMTALK_FROM:}              # 사전 등록된 발신번호
    sms-fallback: ${ALIMTALK_SMS_FALLBACK:false}   # true 면 실패 시 SMS 대체발송(추가 과금)
    template:                            # 심사 승인 후 받은 템플릿 코드를 넣는다
      reg-open: ${ALIMTALK_TPL_REG_OPEN:}
      reg-closing: ${ALIMTALK_TPL_REG_CLOSING:}
      exam-soon: ${ALIMTALK_TPL_EXAM_SOON:}
      changed: ${ALIMTALK_TPL_CHANGED:}

  # ── 카카오톡 "나에게 보내기" (개발·테스트용) ──
  # 사업자등록 없이 카톡 알림을 눈으로 확인하는 유일한 방법.
  # 카카오 문서상 권한 없는 앱은 "앱 멤버"에게만 보낼 수 있어 본인·팀원 테스트 전용이다.
  # 켜려면 oauth.yml 에 카카오 키가 있어야 하고, scope 에 talk_message 가 포함돼야 한다.
  kakao-memo:
    enabled: ${KAKAO_MEMO_ENABLED:false}

  # ── 이메일 (알림톡 폴백) ──
  # 값이 없으면 EmailNotificationSender 가 뜨지 않고 LogNotificationSender 가 남는다.
  email:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@exam-hub.local}
    from-name: 모든시험한번에보기

# ===== 인증 (설계 08) =====
# 소셜 로그인 단독. 키가 없으면 OAuth2 로그인만 꺼지고, 시험 조회·커뮤니티 읽기는 그대로 동작한다.
app:
  jwt:
    secret: ${JWT_SECRET_KEY:exam-hub-local-dev-secret-key-please-change-in-production}
    validity-seconds: 86400          # 24시간. refresh 토큰은 범위 밖 — 만료되면 재로그인
  # 알림 메시지 안의 링크 주소. 운영은 APP_PUBLIC_BASE_URL 하나만 넣으면 여기까지 따라온다 —
  # 변수를 따로 기억해야 하면 잊어버리고, 그러면 배포 후 알림 메일 링크가 localhost 로 간다.
  link-base: ${APP_LINK_BASE:${APP_PUBLIC_BASE_URL:${APP_BASE_URL:http://localhost:8081}}}
  oauth:
    redirect-uri: ${APP_OAUTH_REDIRECT_URI:/oauth/callback}   # 단일 서버라 기본은 같은 출처

# ===== SMTP =====
# 이메일 알림을 켤 때만 채운다. Gmail 은 앱 비밀번호, AWS SES 는 SMTP 자격증명.
spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    # 로컬 가짜 SMTP(인증 없음)로 발송 경로를 검증할 때 둘 다 false 로 내린다.
    # Gmail·SES 는 기본값 그대로.
    mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
    mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
    mail.smtp.connectiontimeout: 5000
    mail.smtp.timeout: 5000
    mail.smtp.writetimeout: 5000

# ===== 매니저(운영자) 계정 =====
# 가입 화면이 없다 — 서버를 띄우는 사람만 만들 수 있게 환경변수로만 만든다.
# 둘 다 있어야 계정이 생기고, 비밀번호를 바꿔 재기동하면 갱신된다(분실 시 되찾는 유일한 길).
# 로컬은 .env, 배포는 Railway 변수 — 이름이 같아 코드 변경 없이 양쪽에서 동작한다.
manager:
  username: ${MANAGER_USERNAME:}
  password: ${MANAGER_PASSWORD:}

# ===== SQL 시드 (data.sql) =====
# data.sql 은 **H2(인메모리)일 때만** 실행된다(embedded 기본값). 운영 MySQL 에서는 안 돈다 —
# 로컬 편의용 매니저 계정이 운영에 딸려 들어가면 안 되기 때문이다.
# 실행 순서는 spring.jpa.defer-datasource-initialization=true 가 보장한다
# (없으면 테이블이 만들어지기 전에 INSERT 가 돌아 기동이 깨진다).
spring.sql:
  init:
    mode: ${SPRING_SQL_INIT_MODE:embedded}
    encoding: UTF-8

# ─────────────────────────────────────────────────────────────
# data.sql 을 언제 돌릴지 — 프로파일로 못 박는다.
#
# 예전엔 mode: embedded 하나로 갈랐다. 로컬이 인메모리 H2 일 때는 그게 맞았는데,
# 로컬 DB 를 **파일 H2** 로 바꾸자 조용히 안 돌기 시작했다. 스프링은 H2 라도
# ':h2:mem' 이 아니면 embedded 로 보지 않기 때문이다 — 그래서 매니저 계정이 안 생겼다.
#
# 로컬은 always(파일이든 메모리든 돈다), 운영은 never 를 명시한다.
# 운영에 never 를 못 박는 건 안전장치다 — data.sql 의 매니저 비밀번호는 저장소에 그대로
# 들어 있어서, 실수로 운영 MySQL 에 돌면 알려진 비밀번호의 관리자 계정이 생긴다.
# ─────────────────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: local
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
---
spring:
  config:
    activate:
      on-profile: prod
  sql:
    init:
      mode: never
