<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모든시험한번에보기 — 시험일정·D-day·접수 알림</title>
    <!-- Halo 테마 초기화: CSS 로드 전에 data-theme 을 세팅해 첫 페인트 깜빡임(FOUC)을 막는다. -->
    <script>
      (function () {
        var s = localStorage.getItem('theme') || 'system';
        var d = s === 'dark' || (s === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
